<!DOCTYPE html>
<html lang="fr" class="bg-dark text-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milano Pizza - Le Workshop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#3d0b0b',
                        light: '#e5e7eb',
                        accent: '#ffffff',
                        'accent-dark': '#d1d5db'
                    },
                    fontFamily: { sans: ['Outfit', 'sans-serif'], }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="antialiased selection:bg-accent selection:text-dark relative">

    <div class="noise"></div>
    <div class="custom-cursor hidden md:block"></div>

    <!-- Header -->
    <header
        class="fixed top-0 left-0 w-full z-50 glass py-4 px-6 md:px-12 flex justify-between items-center transition-all duration-300">
        <a href="index.html"
            class="text-2xl font-black tracking-tighter interactive z-50 flex items-center gap-2 group">
            <i class="ph ph-arrow-left text-2xl group-hover:-translate-x-2 transition-transform"></i>
            <span class="hidden sm:inline-block">Retour</span>
        </a>
        <a href="index.html"
            class="text-2xl font-black tracking-tighter interactive z-50 mix-blend-difference relative group flex items-center gap-2">
            <img src="img/logo/workshop.png" alt="Logo Le Workshop"
                class="h-16 md:h-24 w-auto object-contain -mr-4 md:-mr-8">
            <span class="hidden sm:inline-block">LE WORKSHOP<span
                    class="text-accent group-hover:animate-pulse">.</span></span>
        </a>
    </header>

    <main class="relative z-10 w-full pt-48 min-h-screen">
        <!-- Project Hero -->
        <section class="px-6 md:px-12 pb-20 relative min-h-[70vh] flex flex-col justify-center">
            <div class="max-w-5xl mx-auto w-full text-center">
                <div class="mb-12 reveal-up">
                    <span
                        class="inline-block px-6 py-2 rounded-full border border-yellow-500 text-yellow-500 text-sm font-bold tracking-widest uppercase mb-8">Work
                        in Progress</span>
                    <h1 class="text-5xl md:text-8xl font-black uppercase tracking-tighter mb-6">Milano Pizza</h1>
                    <p class="text-xl text-gray-400 font-light max-w-2xl mx-auto">
                        Ce projet est actuellement en cours de finalisation au sein du Workshop. Nous sommes impatients
                        de vous dévoiler le branding très prochainement.
                    </p>
                </div>

                <div
                    class="w-full max-w-2xl mx-auto aspect-video rounded-3xl overflow-hidden glass border border-white/10 relative reveal-up flex flex-col items-center justify-center p-8">
                    <i class="ph-duotone ph-hammer text-6xl text-gray-500 mb-4 animate-bounce"></i>
                    <p class="text-gray-400 font-bold uppercase tracking-widest">Revenez bientôt</p>
                </div>
            </div>
        </section>

        <!-- Next Project Footer -->
        <section class="py-32 text-center reveal-up border-t border-white/5">
            <p class="text-gray-400 uppercase tracking-widest text-sm mb-4">Projet Suivant</p>
            <a href="projet-mood-permis.html"
                class="text-5xl md:text-7xl font-black uppercase tracking-tighter interactive hover:text-light transition-colors relative group inline-block">
                Mood Permis
                <i
                    class="ph ph-arrow-right absolute -right-16 top-1/2 -translate-y-1/2 text-5xl group-hover:translate-x-4 transition-transform opacity-0 group-hover:opacity-100"></i>
            </a>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
